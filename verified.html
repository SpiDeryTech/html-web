<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verified Syx Hub Obfuscator</title>

<script src="https://unpkg.com/fengari-web/dist/fengari-web.js"></script>

<style>
    body {
        margin: 0;
        background: #0c0f16;
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
    }

    /* Animated Background */
    .bg {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(120deg, #061325, #062948, #061325);
        background-size: 400% 400%;
        animation: gradMove 14s ease infinite;
        z-index: -1;
    }

    @keyframes gradMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin: 60px auto;
        background: rgba(0,0,0,0.45);
        border: 1px solid #1fa2ff;
        backdrop-filter: blur(6px);
        padding: 20px;
        border-radius: 14px;
    }

    textarea {
        width: 100%;
        height: 260px;
        background: #0d0f18;
        border: 1px solid #1fa2ff;
        color: #fff;
        border-radius: 10px;
        padding: 10px;
        font-size: 15px;
        resize: none;
        outline: none;
    }

    button {
        width: 230px;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
        background: #1fa2ff;
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: center;
        transition: 0.2s;
    }
    button:hover {
        background: #1784d8;
    }

    .icon {
        width: 20px; height: 20px; fill: white;
    }

    #downloadBtn {
        display: none;
    }

    #status {
        margin-top: 10px;
        font-size: 15px;
    }
</style>
</head>
<body>
<div class="bg"></div>

<div class="container">
    <h1 style="text-align:center; margin-bottom:20px;">Verified Syx Hub Lua Obfuscator</h1>

    <textarea id="inputCode" placeholder="Paste your Lua code here..."></textarea>

    <div id="status">Status: Waiting...</div>

    <button onclick="attemptFix()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>
        Auto-Fix Script
    </button>

    <button onclick="makeObfuscated()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        Obfuscate Script
    </button>

    <button id="downloadBtn" onclick="downloadLua()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M5 20h14v-2H5m7-14v9l3.5-3.5 1.42 1.42L12 18l-4.92-4.92 1.42-1.42L11 13V4h2z"/></svg>
        Download Obfuscated
    </button>
</div>

<script>

let obContent = "";

/* -------------------------
   REAL LUA SYNTAX CHECKER
--------------------------*/
function checkLua(code) {
    try {
        fengari.load(code); 
        status.innerText = "Status: Valid Lua ✓";
        status.style.color = "#7dffb5";
        return true;

    } catch(err) {
        status.innerText = "Lua Error ❌\n" + err.message;
        status.style.color = "#ff6b6b";
        return false;
    }
}

/* -------------------------
   AUTO FIX ENGINE
--------------------------*/
function attemptFix() {
    let code = inputCode.value;

    // fixes missing end (simple safe)
    let missingEnd = (code.match(/function/g) || []).length -
                     (code.match(/end/g) || []).length;

    for (let i = 0; i < missingEnd; i++)
        code += "\nend";

    // fix missing "then"
    code = code.replace(/if (.-)\n/g, "if $1 then\n");

    // unclosed string fix
    if ((code.match(/"/g) || []).length % 2 !== 0)
        code += "\"";

    if (checkLua(code)) {
        inputCode.value = code;
        alert("✔ Auto-fix successful.");
    } else {
        alert("⚠ Could not fix all errors.");
    }
}

/* -------------------------
   HEAVY OBFUSCATOR
--------------------------*/
function makeObfuscated() {
    let code = inputCode.value.trim();

    if (!checkLua(code)) return;

    // filler for 80kb output
    let filler = "X".repeat(90000);

    let encoded = btoa(unescape(encodeURIComponent(code)));

    let final = 
`--[[ Protected Script - Verified Syx Hub https://discord.gg/X3T9d4wJjz ]]--

local _FILL = "${filler}"

local d=function(z)
    return (function(str)
        return str:gsub(".", function(c)
            return string.char(c:byte())
        end)
    end)(z)
end

local DATA = "${encoded}"

local script = d(DATA)
load(script)()
`;

    obContent = final;
    downloadBtn.style.display = "flex";

    status.innerText = "Status: Obfuscation Complete ✓";
    status.style.color = "#7dffb5";
}

/* -------------------------
   DOWNLOAD LUA
--------------------------*/
function downloadLua() {
    const blob = new Blob([obContent], { type: "text/plain" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "protected.lua";
    link.click();
}

inputCode.addEventListener("input", ()=> {
    if (inputCode.value.trim() === "") {
        status.innerText = "Status: Waiting...";
        status.style.color = "#fff";
        return;
    }
    checkLua(inputCode.value);
});

</script>

</body>
</html>
